<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Overpass-to-Json-/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Light Data Fetcher</title>
    <script type="module" crossorigin src="/Overpass-to-Json-/assets/index-CWMP9XJK.js"></script>
    <link rel="stylesheet" crossorigin href="/Overpass-to-Json-/assets/index-D6FhjDG1.css">
  </head>
  <body>
    <div id="app">
      <h1>Traffic Light Data Fetcher</h1>

      <div class="card area-selection">
        <h3>Filter by Country or Region</h3>
        <div class="input-group">
          <label for="country">Country/Region Name</label>
          <input type="text" id="country" placeholder="e.g. Germany, Berlin, Tokyo">
        </div>

        <h3 style="margin-top: 1.5rem;">Or Define Bounding Box</h3>
        <div class="bbox-inputs">
          <div>
            <label for="south">South</label>
            <input type="number" id="south" placeholder="e.g. 52.50" step="0.01">
          </div>
          <div>
            <label for="west">West</label>
            <input type="number" id="west" placeholder="e.g. 13.35" step="0.01">
          </div>
          <div>
            <label for="north">North</label>
            <input type="number" id="north" placeholder="e.g. 52.55" step="0.01">
          </div>
          <div>
            <label for="east">East</label>
            <input type="number" id="east" placeholder="e.g. 13.45" step="0.01">
          </div>
        </div>
        <p class="hint">Leave all empty for a global query (likely to timeout).</p>
      </div>

      <div class="card actions">
        <button id="fetch-btn" type="button">Fetch Traffic Lights Data</button>
        <button id="download-btn" type="button" disabled>Download JSON</button>
      </div>

      <div id="status">Ready.</div>
      <pre id="log"></pre>
    </div>
  </body>
</html>
